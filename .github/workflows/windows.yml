name: Windows
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          arch: win64_msvc2019_64
      - name: Build and deploy x64
        shell: cmd
        env:
          QSC_QT_ROOT: ${{ env.QT_ROOT_DIR }}
          QSC_VCVARSALL: C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat
        run: call ci\win\bootstrap.cmd
      - uses: actions/upload-artifact@v4
        with:
          name: QtScrcpy-windows-x64
          path: out/deploy/
          if-no-files-found: error
